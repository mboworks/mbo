name: Save CMake compiler outputs
description: Bound and refresh main's ccache outputs after successful CMake validation.
inputs:
  key:
    description: Fresh key from the restore action.
    required: true
runs:
  using: composite
  steps:
    - name: Bound the compiler cache before upload
      if: github.ref == 'refs/heads/main'
      id: bound
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.key }}
      run: |
        python3 - "${CCACHE_DIR}" "${CACHE_KEY}" "${RUNNER_TEMP}/${CACHE_KEY}.json" <<'PY'
        import json
        from pathlib import Path
        import subprocess
        import sys

        root = Path(sys.argv[1])

        def inventory():
            sizes = [path.stat().st_size for path in root.rglob("*") if path.is_file()]
            return sum(sizes), len(sizes)

        before, before_files = inventory()
        subprocess.run(["ccache", "--cleanup"], check=True)
        retained, retained_files = inventory()
        if retained >= 600_000_000:
            raise SystemExit("::error::CMake compiler cache exceeds its upload budget")
        Path(sys.argv[3]).write_text(json.dumps({
            "key": sys.argv[2], "before": before, "uncompressed": retained,
            "evicted": max(0, before_files - retained_files),
        }) + "\n")
        PY
    - uses: actions/cache/save@v6
      if: github.ref == 'refs/heads/main'
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ inputs.key }}
    - name: Retire replaced main compiler-cache generations
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        REPLACEMENT_KEY: ${{ inputs.key }}
      run: |
        if ! cache_json=$(gh cache list --ref refs/heads/main --limit 10000 --json id,key,ref,sizeInBytes,createdAt); then
          echo "::warning::Cache inventory unavailable; retaining previous generations"
          exit 0
        fi
        printf '%s' "${cache_json}" | python3 tools/cache_report.py --record "${RUNNER_TEMP}/${REPLACEMENT_KEY}.json"
        obsolete=$(printf '%s' "${cache_json}" | python3 tools/cache_cleanup.py --replacement-key "${REPLACEMENT_KEY}")
        for cache_id in ${obsolete}; do
          if ! gh cache delete "${cache_id}"; then
            echo "::warning::Could not retire cache ${cache_id}; scheduled cleanup will retry"
          fi
        done
    - name: Preserve compiler-cache measurements for the final report
      if: always() && steps.bound.outcome == 'success' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: cache-metrics-${{ inputs.key }}
        path: ${{ runner.temp }}/${{ inputs.key }}.json
        retention-days: 1
        if-no-files-found: error
