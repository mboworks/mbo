name: Maintain Actions caches

on:
  workflow_run:
    workflows: [Test, Release]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# This workflow runs trusted code from the default branch after another workflow completes. It
# needs write access only to delete cache entries; it never checks out or executes a PR head.
permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Delete closed-PR, tag, superseded, and oversized cache entries
        run: |
          set -euo pipefail
          if ! cache_json=$(gh cache list --limit 10000 --json id,key,ref,sizeInBytes,createdAt 2>&1); then
            echo "::warning title=Cache size enforcement skipped::${cache_json}"
            exit 0
          fi
          gh api --paginate --slurp "repos/${GH_REPO}/pulls?state=closed&per_page=100" >closed-prs.json
          obsolete=$(printf '%s' "${cache_json}" | python3 tools/cache_cleanup.py --closed-prs closed-prs.json)
          for cache_id in ${obsolete}; do
            echo "Deleting cache ${cache_id}: closed PR, tag, superseded generation, or size limit"
            gh cache delete "${cache_id}"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
