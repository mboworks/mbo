name: Publish coverage

on:
  # Use trusted default-branch code; never check out or execute a PR head.
  pull_request_target:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional completed Test or Release run to publish; empty refreshes metadata only
        required: false
        type: string
  workflow_run:
    workflows: [Release, Test]
    types: [completed]

# Updating the retained site and deploying it must be one serial operation: two runs restoring the
# same branch concurrently would otherwise overwrite whichever report was pushed first.
concurrency:
  group: coverage-pages
  queue: max
  cancel-in-progress: false

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This workflow always comes from the trusted default branch. It consumes the report emitted
      # by an unprivileged test run; PR code never receives the token that updates Pages.
      - uses: actions/checkout@v7
        with:
          path: source
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          path: site
          ref: coverage-pages
      - name: Check coverage job result
        id: coverage-result
        if: github.event_name == 'workflow_run' || inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > coverage-run.json
          jq -e '.status == "completed" and (.path == ".github/workflows/main.yml" or .path == ".github/workflows/test.yml" or .path == ".github/workflows/release.yml")' \
            coverage-run.json >/dev/null
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" > coverage-jobs.json
          eligible="$(jq 'any(.[].jobs[]; .name == "coverage" and .conclusion == "success")' coverage-jobs.json)"
          echo "eligible=${eligible}" >>"${GITHUB_OUTPUT}"
          jq -r '{created_at, updated_at, head_sha, run_attempt, id, run_started_at} | to_entries[] | "\(.key)=\(.value)"' \
            coverage-run.json >>"${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@v8
        if: steps.coverage-result.outputs.eligible == 'true'
        with:
          github-token: ${{ github.token }}
          name: coverage-report
          path: report
          run-id: ${{ steps.coverage-result.outputs.id }}
      - name: Select and stage the report
        if: steps.coverage-result.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CREATED_AT: ${{ steps.coverage-result.outputs.created_at }}
          SOURCE_COMPLETED_AT: ${{ steps.coverage-result.outputs.updated_at }}
          SOURCE_HEAD_SHA: ${{ steps.coverage-result.outputs.head_sha }}
          SOURCE_RUN_ATTEMPT: ${{ steps.coverage-result.outputs.run_attempt }}
          SOURCE_RUN_ID: ${{ steps.coverage-result.outputs.id }}
          SOURCE_STARTED_AT: ${{ steps.coverage-result.outputs.run_started_at }}
        run: |
          set -euo pipefail
          target="$(<report/coverage-target.txt)"
          if [[ ! "${target}" =~ ^(main|pr/[1-9][0-9]*|tag/[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid coverage target: ${target}" >&2
            exit 1
          fi
          python3 source/tools/coverage_index.py metadata \
            report/coverage-html/coverage-summary.json \
            "${target}" \
            report/coverage-html/coverage-meta.json \
            --completed-at "${SOURCE_COMPLETED_AT}" \
            --created-at "${SOURCE_CREATED_AT}" \
            --head-sha "${SOURCE_HEAD_SHA}" \
            --run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --run-id "${SOURCE_RUN_ID}" \
            --started-at "${SOURCE_STARTED_AT}"
          # Migrate every report produced before the namespaced PR layout was introduced. This is
          # deliberately registry-like rather than naming PR 609/610: any old retained prN report
          # is moved once, and future reports are written directly below pr/N.
          for legacy in site/coverage/pr[1-9]*; do
            if [[ ! -d "${legacy}" ]]; then
              continue
            fi
            number="${legacy##*pr}"
            mkdir -p site/coverage/pr
            git -C site mv "coverage/pr${number}" "coverage/pr/${number}"
          done
          # Preserve both reports, even when an older incoming run cannot replace the latest URL.
          python3 source/tools/coverage_index.py archive site/coverage --incoming report/coverage-html
          current="site/coverage/${target}/coverage-meta.json"
          if [[ -f "${current}" ]] && ! python3 source/tools/coverage_index.py newer \
            report/coverage-html/coverage-meta.json "${current}"; then
            echo "Ignoring older ${target} report from run ${SOURCE_RUN_ID}"
          else
            mkdir -p "site/coverage/${target}"
            rsync --archive --delete report/coverage-html/ "site/coverage/${target}/"
          fi
      - name: Refresh metadata and publish retained reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Bootstrap retained reports created before metadata became the report registry. Their
          # epoch identity lets any real subsequent run replace them.
          while IFS= read -r -d '' summary; do
            report_dir="${summary%/coverage-summary.json}"
            if [[ -f "${report_dir}/coverage-meta.json" ]]; then
              continue
            fi
            retained_target="${report_dir#site/coverage/}"
            python3 source/tools/coverage_index.py metadata \
              "${summary}" \
              "${retained_target}" \
              "${report_dir}/coverage-meta.json" \
              --completed-at "1970-01-01T00:00:00Z" \
              --created-at "1970-01-01T00:00:00Z" \
              --head-sha legacy \
              --run-attempt 0 \
              --run-id 0 \
              --started-at "1970-01-01T00:00:00Z"
          done < <(find site/coverage -name coverage-summary.json -print0)
          # Refresh every retained PR: its report can predate the merge, and CI completion
          # order must not affect placement relative to release tags on main.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" > coverage-pulls.json
          python3 source/tools/coverage_index.py history site/coverage source coverage-pulls.json --fetch-aggregation-heads
          python3 source/tools/coverage_index.py archive site/coverage
          python3 source/tools/coverage_index.py site site/coverage site/coverage/index.html
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add coverage
          if [[ -d site/releases ]]; then
            git -C site add releases
          fi
          if git -C site diff --cached --quiet; then
            echo "Coverage report is unchanged"
          else
            git -C site commit -m "coverage: publish reports and refresh PR metadata"
            git -C site push
          fi
          mkdir -p public
          rsync --archive --exclude='.git' site/ public/
          python3 source/tools/site_artwork.py source/docs/assets public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
