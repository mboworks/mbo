name: Test
# Validate pull requests, including forks, in pull-request context. Pushes run
# only on main so a same-repository PR does not duplicate the full matrix.
# Release tags are handled by release.yml.
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  # The reusable coverage job can associate branch commits with a PR.
  pull-requests: read

# A new commit supersedes an older run for the same branch or pull request.
# Never cancel main: its completed full-matrix result is an integration record,
# and release tags run in the separate non-cancelling release workflow.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  trunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          # PR validation deliberately uses a read-only token. Retain findings
          # as an artifact instead of asking Trunk to create check annotations.
          save-annotations: true
      - name: Trunk must not own git hooks
        run: |
          # Git hooks belong to pre-commit (see .pre-commit-config.yaml); trunk's
          # git-hook actions are disabled in .trunk/trunk.yaml so trunk never
          # clobbers pre-commit's clang-format run. This can only be checked here:
          # a pre-commit hook can't (if trunk owned core.hooksPath, pre-commit
          # would never run), and a trunk linter can't (it runs in an isolated
          # sandbox blind to the real git config).
          # 1) Config invariant: no trunk git-hook action may be enabled.
          enabled="$(yq -r '.actions.enabled // [] | .[]' .trunk/trunk.yaml)"
          for action in trunk-announce trunk-check-pre-commit trunk-check-pre-push \
            trunk-check-pre-push-always trunk-fmt-pre-commit trufflehog-pre-commit; do
            if grep -qxF "${action}" <<<"${enabled}"; then
              echo "::error::trunk git-hook action '${action}' is enabled in .trunk/trunk.yaml; disable it so pre-commit keeps ownership of git hooks"
              exit 1
            fi
          done
          # 2) Runtime truth (when trunk is available): sync hooks, then require
          #    core.hooksPath not point back into trunk's cache.
          if command -v trunk >/dev/null 2>&1; then
            trunk git-hooks sync 2>&1 || true
            hooks_path="$(git config --get core.hooksPath || true)"
            if [[ "${hooks_path}" == *trunk* ]]; then
              echo "::error::core.hooksPath is trunk-managed (${hooks_path}); trunk grabbed the git hooks"
              exit 1
            fi
          fi
          echo "OK: pre-commit owns git hooks; trunk is not managing them"

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        env:
          # The `trunk` job runs the full `trunk check`; do not also run trunk
          # from pre-commit in CI (see the trunk-fmt hook). Likewise the
          # `clang-tidy` job owns clang-tidy: it needs a compile_commands.json
          # this job deliberately does not build. Skip it here to avoid running
          # the same enforcing gate without its required compilation database.
          SKIP: trunk-fmt,clang-tidy
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: always()

  clang-tidy:
    needs: [trunk, pre-commit]
    runs-on: ubuntu-latest
    # There is deliberately no job-level `continue-on-error`: the compilation
    # database, toolchain, parsing, and clang-tidy findings all gate the change.
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the branch can be diffed against `main` to pick the
          # changed sources below.
          fetch-depth: 0
      - uses: bazelbuild/setup-bazelisk@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Select the scope to lint
        # clang-tidy costs ~50s per translation unit here, so linting all sources
        # is reserved for main and changes that can affect many compilation
        # units. tools/clang_tidy_scope.py promotes headers, generated-header
        # templates, and .bzl changes from this branch scope to a full sweep.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "CLANG_TIDY_SCOPE=--all-files" >>"${GITHUB_ENV}"
            git ls-files -- \
              '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' \
              >.clang-tidy-inputs
            echo "Linting the whole tree (on main)."
          else
            git fetch --no-tags --quiet origin main
            WIDE_CHANGES="$(git diff --name-only origin/main...HEAD -- \
              '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' \
              '.github/workflows/main.yml' '.pre-commit-config.yaml' \
              'tools/clang_tidy.sh' 'tools/clang_tidy_compdb.py' \
              'tools/clang_tidy_runner.py' 'tools/clang_tidy_scope.py')"
            if [ -n "${WIDE_CHANGES}" ]; then
              echo "CLANG_TIDY_SCOPE=--all-files" >>"${GITHUB_ENV}"
              git ls-files -- \
                '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' \
                >.clang-tidy-inputs
              echo "Linting the whole tree because these compilation-wide files changed:"
              echo "${WIDE_CHANGES}" | sed 's/^/  /'
            else
              echo "CLANG_TIDY_SCOPE=--from-ref origin/main --to-ref HEAD" >>"${GITHUB_ENV}"
              git diff --name-only origin/main...HEAD -- \
                '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' \
                >.clang-tidy-inputs
              echo "Linting translation units changed against origin/main:"
              git diff --name-only origin/main...HEAD -- \
              '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' |
                sed 's/^/  /'
            fi
          fi

      # Disk cache only (compiled action outputs). The output root is not cached:
      # it holds the extracted hermetic LLVM, which crowded the cache limit for no
      # benefit. Every bazel call in this job picks the flag up via .bazelrc.user.
      - name: Route bazel to a disk cache
        run: echo "common --disk_cache=$HOME/.cache/bazel_disk-cache" > .bazelrc.user
      - uses: actions/cache/restore@v6
        id: cache_restore
        with:
          path: "~/.cache/bazel_disk-cache"
          key: clang-tidy-${{github.ref}}-${{github.sha}}
          restore-keys: |
            clang-tidy-${{github.ref}}
            clang-tidy-refs/heads/main
            clang-tidy

      - name: Build generated sources and headers
        # Generated headers must exist on disk before the compile DB is
        # extracted, or the extractor cannot resolve the sources that include
        # them (`hash_mangle_seed_gen.h is missing`) and those translation units
        # land in the DB degraded - which would later read as clang-tidy
        # findings rather than as the build artifact gap it really is.
        # Generated headers are NOT the only build output a translation unit needs
        # to parse: headers from external repos (`rules_cc/cc/runfiles/runfiles.h`
        # and friends) are materialised into the execroot only once something that
        # depends on them is built. A partial build leaves them absent, the TU
        # fails to resolve the include, and clang-tidy then reports confident
        # nonsense from the wreckage of that parse - which is how a clean local
        # sweep and a red CI run can disagree. So build `//...` too.
        run: |
          set -euo pipefail
          # Read into an array without `mapfile`, so this snippet can also be run
          # as-is on stock macOS bash 3.2 when reproducing a CI result locally.
          GENERATED=()
          while IFS= read -r target; do
            GENERATED+=("${target}")
          done < <(bazel query 'kind("generated file", //...:*)' |
            grep -E '\.(h|hh|hpp|inc|ipp|cc|cpp|cxx)$')
          if [ "${#GENERATED[@]}" -eq 0 ]; then
            echo "::error::No generated sources/headers found. Either the query or the extension filter needs updating; without this the compile DB silently degrades."
            exit 1
          fi
          printf 'Building %s generated file(s):\n' "${#GENERATED[@]}"
          printf '  %s\n' "${GENERATED[@]}"
          bazel build --config=clang "${GENERATED[@]}"

          # Everything else a linted TU includes, external repo headers included.
          bazel build --config=clang-tidy //...

          # Also build the `manual` targets that are linted. `bazel test //...`
          # skips them, so a change that breaks one compiles green everywhere and
          # only surfaces when someone runs the benchmark by hand - which is how a
          # bad `const` in limited_set_benchmark.h reached main in #275.
          TAGGED=()
          while IFS= read -r target; do
            TAGGED+=("${target}")
          done < <(bazel query 'attr(tags, "clang-tidy", //...)' | sed 's|^@@||')
          if [ "${#TAGGED[@]}" -gt 0 ]; then
            printf 'Building %s clang-tidy-tagged manual target(s):\n' "${#TAGGED[@]}"
            printf '  %s\n' "${TAGGED[@]}"
            bazel build --config=clang "${TAGGED[@]}"
          fi

      - name: Generate compile_commands.json
        # The compile DB is a local artifact (gitignored), so it has to be built
        # here. The script fetches the hermetic LLVM toolchain if needed and
        # records ITS clang as the compiler, which is what makes the resulting
        # commands parseable by the matching hermetic clang-tidy.
        run: ./compile_commands-update.sh

      - uses: actions/upload-artifact@v7
        # Only from `main`, which is the run that lints the whole tree: that DB
        # is the one worth keeping, to reproduce a finding locally against the
        # exact same commands and to inspect flag/toolchain drift. A branch run
        # lints only what the branch changed, so its DB describes a near-empty
        # lint and is not worth storing.
        id: upload_cdb
        if: github.ref == 'refs/heads/main'
        with:
          name: compile-commands-json
          path: compile_commands.json
          retention-days: 14
          if-no-files-found: error

      - name: Summarize the compile DB
        # Renders at the top of the run page, so the DB's shape and (on main) a
        # direct link to it are visible without digging through step logs or
        # scrolling to the artifacts panel.
        run: |
          set -euo pipefail
          STATS="$(python3 -c '
          import collections, json
          entries = json.load(open("compile_commands.json"))
          files = collections.Counter(e["file"] for e in entries)
          print(len(entries), len(files), sum(n - 1 for n in files.values() if n > 1))
          ')"
          read -r ENTRIES UNIQUE DUPES <<<"${STATS}"
          {
            echo "### clang-tidy compile database"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Entries | ${ENTRIES} |"
            echo "| Unique files | ${UNIQUE} |"
            echo "| Duplicate entries | ${DUPES} |"
            echo "| Lint scope | \`${CLANG_TIDY_SCOPE}\` |"
            if [ -n "${CDB_ARTIFACT_URL}" ]; then
              echo "| Artifact | [compile-commands-json](${CDB_ARTIFACT_URL}) |"
            else
              echo "| Artifact | not uploaded (branch run; only \`main\` publishes one) |"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
        env:
          CDB_ARTIFACT_URL: ${{steps.upload_cdb.outputs.artifact-url}}

      - name: Run clang-tidy with progress
        # Invoke the same script as the pre-commit hook directly: pre-commit
        # captures hook output, hiding progress until the process exits.
        run: |
          set -euo pipefail
          FILES=()
          while IFS= read -r file; do
            FILES+=("${file}")
          done <.clang-tidy-inputs
          tools/clang_tidy.sh "${FILES[@]}"

      - name: Check clang-tidy Bazel disk cache size
        if: always()
        id: cache_size
        run: |
          cache_path="${HOME}/.cache/bazel_disk-cache"
          cache_size_kib=0
          if [[ -d "${cache_path}" ]]; then
            cache_size_kib="$(du -sk "${cache_path}" | awk '{print $1}')"
          fi
          echo "Bazel disk cache: ${cache_size_kib} KiB (limit: 512000 KiB)"
          if (( cache_size_kib >= 500 * 1024 )); then
            echo "::warning::Not saving Bazel disk cache at or above the 500 MiB limit."
            echo "save=false" >>"${GITHUB_OUTPUT}"
          else
            echo "save=true" >>"${GITHUB_OUTPUT}"
          fi

      - uses: actions/cache/save@v6
        if: always() && steps.cache_restore.outputs.cache-hit != 'true' && steps.cache_size.outputs.save == 'true'
        with:
          path: "~/.cache/bazel_disk-cache"
          key: clang-tidy-${{github.ref}}-${{github.sha}}

  test-gcc:
    needs: [trunk, pre-commit]
    secrets: inherit
    strategy:
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc]
        # GCC 14 is the minimum supported GCC and gets the sanitizer and
        # optimized configurations here, early.
        gcc_version: [14]
        bazel_config: [asan, opt]

    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      gcc_version: ${{ matrix.gcc_version }}
      bazel_config: ${{ matrix.bazel_config }}

  coverage:
    needs: [trunk, pre-commit]
    secrets: inherit
    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ubuntu-latest
      compiler: clang
      llvm_version: 22.1.8
      bazel_config: coverage

  test-bcr:
    needs: [trunk, pre-commit, test-gcc]
    secrets: inherit
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
        compiler: [gcc, native, clang]
        gcc_version: [14]
        # The pinned default toolchain (see bazelmod/llvm.MODULE.bazel).
        llvm_version: [22.1.8]
        bazel_config: [opt]
        # Bazel-version compatibility rungs: the minimum supported release and
        # the latest stable release, crossed with the os/compiler combos below.
        bazel_version: [8.0.0, 9.2.0]
        exclude:
          - os: ubuntu-latest
            compiler: native
          - os: macos-26
            compiler: gcc
          # test-gcc already covers GCC 14, opt, and the default Bazel 9.2.
          # Keep only the Bazel 8 GCC cell here as a compatibility check.
          - os: ubuntu-latest
            compiler: gcc
            bazel_version: 9.2.0
          # The 8.x rung is a build-system-compat check (MODULE.bazel
          # loading, rules resolution) - platform-agnostic, so run it on
          # ubuntu only. macOS keeps 9.2.0 for platform coverage.
          - os: macos-26
            bazel_version: 8.0.0

    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      gcc_version: ${{ matrix.gcc_version }}
      llvm_version: ${{ matrix.llvm_version }}
      bazel_config: ${{ matrix.bazel_config }}
      bazel_version: ${{ matrix.bazel_version }}

  test-clang:
    needs: [trunk, pre-commit, test-gcc, test-bcr]
    secrets: inherit
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
        compiler: [clang]
        # Hermetic toolchains_llvm clang (independent of the runner's Apple clang).
        # Optimized LLVM 22 builds run in test-bcr with explicit Bazel versions;
        # this job owns the sanitizer coverage without duplicating them.
        llvm_version: [22.1.8]
        bazel_config: [asan]

    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      llvm_version: ${{ matrix.llvm_version }}
      bazel_config: ${{ matrix.bazel_config }}

  done:
    needs:
      [trunk, pre-commit, clang-tidy, coverage, test-gcc, test-clang, test-bcr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure every job is wired into this gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Parse the workflow with a real YAML reader (yq) and fail if any
          # declared job (other than this gate) is absent from `needs` above, so
          # a newly added job cannot silently escape the required gate.
          declared="$(yq '.jobs | keys | .[]' .github/workflows/main.yml |
            grep -vx done | sort)"
          wired="$(jq -r 'keys[]' <<<"${NEEDS_JSON}" | sort)"
          missing="$(comm -23 <(printf '%s\n' "${declared}") <(printf '%s\n' "${wired}"))"
          if [[ -n "${missing}" ]]; then
            echo "Jobs declared in the workflow but missing from done.needs:"
            while read -r job; do
              echo "  - ${job}"
              echo "::error title=Gate is missing a job::${job} not in done.needs"
            done <<<"${missing}"
            exit 1
          fi
          echo "done covers all $(grep -c . <<<"${declared}") workflow jobs."
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
