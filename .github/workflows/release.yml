name: Release
on:
  push:
    tags:
      # Numeric semver only (e.g. 0.11.0); releases are <num>.<num>.<num>. This
      # is stricter than "*.*.*", which also matches things like "v1.2.x".
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  # test.yml declares this for its coverage association fallback. The release
  # supplies an explicit tag target, but a reusable workflow cannot request a
  # scope its caller omitted.
  pull-requests: read

jobs:
  coverage:
    secrets: inherit
    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ubuntu-latest
      compiler: clang
      llvm_version: 22.1.8
      bazel_config: coverage
      coverage_target: ${{ format('tag/{0}', github.ref_name) }}

  release:
    needs: coverage
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      release_files: mbo-*.tar.gz
      # Keep the GitHub release provisional until the secondary BCR
      # publication process has completed.
      prerelease: true
      bazel_test_command: "bazel test //... --test_tag_filters=-lfs"

  # Mirror the release to the Bazel Central Registry (replaces the retired
  # publish-to-bcr GitHub App). See .github/workflows/publish.yaml.
  publish:
    needs: release
    # Grant what publish.yaml's job requests; overrides the workflow-level
    # read permission, and a called workflow cannot exceed the caller's permissions.
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ github.ref_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
