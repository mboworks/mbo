name: Reusable Test Runner

permissions:
  contents: read
  # The coverage target fallback associates a commit with its pull request.
  pull-requests: read

on:
  workflow_call:
    inputs:
      continue-on-error:
        description: "Whether to continue on error (e.g. prevent parallel matrix operations to stop)."
        type: boolean
        default: false
      os:
        description: "The operating system the tests will be run on."
        type: string
        default: ubuntu-latest
      compiler:
        description: "The compiler to use (clang, gcc)."
        type: string
        default: clang
      llvm_version:
        description: "The LLVM version to use. This is only for compiler=clang and will be ignored otherwise."
        type: string
        default: ""
      gcc_version:
        description: "The GCC version to use. This is only for compiler=gcc and will be ignored otherwise (e.g. 14)."
        type: string
        default: ""
      bazel_config:
        description: "The way how Bazel should operate compilation and tests, one of (asan, coverage, fastbuild, opt)."
        type: string
        default: opt
      bazel_version:
        description: "The Bazel version to pin via `.bazelversion` (e.g. 8.0.0, 9.2.0). If empty the checked-in `.bazelversion` is used as-is."
        type: string
        default: ""
      coverage_target:
        description: "Retained coverage destination (main, pr/N, or tag/X.Y.Z); inferred when empty."
        type: string
        default: ""

env:
  CACHE_KEY_PREFIX: ${{inputs.os}}-bzlmod_${{inputs.compiler}}_${{inputs.compiler == 'clang' && inputs.llvm_version || ''}}_${{inputs.compiler == 'gcc' && inputs.gcc_version || ''}}_${{inputs.bazel_config}}_bazel${{inputs.bazel_version}}

jobs:
  test:
    runs-on: ${{inputs.os}}
    continue-on-error: ${{inputs.continue-on-error}}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch measurement bundles (Git LFS)
        # The `//mbo/hash/measurements:quality_sh_test` bazel test reads the
        # committed data bundles for the SMHasher3 quality tables; actions/checkout
        # leaves them as LFS pointers, so materialize just those (each is small).
        run: git lfs pull --include="mbo/hash/measurements/data/*.tgz"
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Install GCC
        if: ${{inputs.compiler == 'gcc' && inputs.gcc_version != ''}}
        run: |
          sudo apt install gcc-${{inputs.gcc_version}} g++-${{inputs.gcc_version}}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{inputs.gcc_version}} 100 --slave /usr/bin/g++ g++ /usr/bin/g++-${{inputs.gcc_version}} --slave /usr/bin/gcov gcov /usr/bin/gcov-${{inputs.gcc_version}}
          sudo update-alternatives --set gcc /usr/bin/gcc-${{inputs.gcc_version}}
      - name: Install coverage report tooling
        if: inputs.bazel_config == 'coverage'
        run: |
          # Ubuntu supplies LCOV's Perl dependencies, but its old genhtml ignores
          # metric-specific color thresholds. Overlay the pinned verified release.
          sudo apt install lcov
          tools/install_lcov.sh "${RUNNER_TEMP}/lcov"
          echo "${RUNNER_TEMP}/lcov/bin" >>"${GITHUB_PATH}"

      # The DISK cache (compiled action outputs) is what recurs and what pays; the
      # output root is deliberately NOT cached anymore - for clang cells it holds the
      # extracted ~4 GB hermetic LLVM, which crowded the 10 GB repo limit for no
      # benefit (LLVM re-downloads quickly, and the symbolizer wrapper resolves via
      # runfiles so a fresh fetch location is fine). Ported from mboworks/xff #409+#411.
      - name: Restore Bazel ${{inputs.bazel_config}} disk cache
        uses: actions/cache/restore@v6
        id: cache_restore
        with:
          path: "~/.cache/bazel_disk-cache"
          key: ${{env.CACHE_KEY_PREFIX}}-${{github.ref}}-${{github.sha}}
          restore-keys: |
            ${{env.CACHE_KEY_PREFIX}}-${{github.ref}}
            ${{env.CACHE_KEY_PREFIX}}-refs/heads/main
            ${{env.CACHE_KEY_PREFIX}}
      - name: Verify Xcode & SDK
        if: runner.os == 'macOS'
        run: |
          echo "=== xcode-select ==="
          xcode-select -p || { echo "xcode-select not configured"; exit 1; }
          echo "=== xcodebuild version ==="
          xcodebuild -version || { echo "xcodebuild not available"; exit 1; }
          echo "=== clang version ==="
          clang --version || echo "clang not found"
          echo "=== show sdk path via xcrun ==="
          SDKPATH="$(xcrun --show-sdk-path 2>/dev/null || true)"
          echo "SDKPATH=${SDKPATH}"
          if [ -z "${SDKPATH}" ]; then
          echo "ERROR: xcrun could not find an SDK. Xcode/CLT may not be installed or xcode-select is misconfigured."
          exit 1
          fi
          echo "Exporting SDKROOT=${SDKPATH}"
          echo "SDKROOT=${SDKPATH}" >> $GITHUB_ENV

      - name: Setup
        # Resolve the C++ toolchain selection and the Bazel invocation flags
        # exactly ONCE, then export them via `$GITHUB_ENV` so that both
        # "Show compiler" and "Build and Test" consume a single source of truth
        # (no copy-pasted selection logic that can drift). The only side effect
        # beyond the environment is mutating `bazelmod/llvm.MODULE.bazel` in the
        # checkout to pin the requested LLVM version. `BAZEL_INIT`/`BAZEL_ARGS`
        # are exported as space-separated strings; none of their elements
        # contain spaces, so later steps re-split them with unquoted expansion.
        run: |
          set -euo pipefail
          if [ "${{inputs.compiler}}:${{inputs.gcc_version}}" == "gcc:" ]; then
            echo "::error::When compiler=='gcc', a valid 'gcc_version' must be given."
            exit 1
          fi
          declare -a BAZEL_INIT=()
          declare -a BAZEL_ARGS=()
          CACHE_ROOT=~/.cache
          BAZEL_INIT+=("--output_user_root=${CACHE_ROOT}/bazel")
          BAZEL_ARGS+=("--repository_cache=${CACHE_ROOT}/bazel_repo-cache")
          BAZEL_ARGS+=("--disk_cache=${CACHE_ROOT}/bazel_disk-cache")
          EXPECT=""
          if [ "${{inputs.compiler}}" == "clang" ]; then
            # We deliberately do NOT clear CC/CXX here (the old `unset CC/CXX`).
            # Only the `gcc` branch ever exports CC/CXX, each matrix entry runs in
            # its own fresh job, and GitHub-hosted runners don't pre-set them --
            # so in a `clang` job they are simply absent. More importantly,
            # `--config=clang` selects the hermetic toolchains_llvm toolchain via
            # Bazel toolchain resolution (`--extra_toolchains`), independent of
            # CC/CXX (those only feed the unused `@local_config_cc` fallback). The
            # `EXPECT="Clang:"` assertion in "Show compiler" then verifies the
            # actually-selected compiler, which is a stronger guarantee than the
            # old blind `unset`. (Note: $GITHUB_ENV cannot truly unset a variable
            # anyway -- it can only set it empty, and an empty `CC=` can confuse
            # `@local_config_cc` autoconfig, so clearing it that way would be
            # worse than leaving it absent.)
            BAZEL_ARGS+=("--config=clang")
            EXPECT="Clang:"
            if [ -r "bazelmod/llvm.${{inputs.llvm_version}}.MODULE.bazel" ]; then
              cp "bazelmod/llvm.${{inputs.llvm_version}}.MODULE.bazel" bazelmod/llvm.MODULE.bazel
            elif [ -n "${{inputs.llvm_version}}" ]; then
              CONTROL_FILE=bazelmod/llvm.MODULE.bazel
              sed -e 's,llvm_version = ".*",llvm_version = "${{inputs.llvm_version}}",g' "${CONTROL_FILE}" > "${CONTROL_FILE}.new"
              mv "${CONTROL_FILE}.new" "${CONTROL_FILE}"
            fi
          elif [ "${{inputs.compiler}}" == "gcc" ]; then
            echo "CC=/usr/bin/gcc" >> "${GITHUB_ENV}"
            echo "CXX=/usr/bin/g++" >> "${GITHUB_ENV}"
            EXPECT="GCC:"
          elif [ "${{inputs.compiler}}" == "native" ]; then
            # Use whatever is found!
            if [ -n "${CC:-}" ] && [ -x "$(which gcc)" ]; then
              echo "CC=$(which gcc)" >> "${GITHUB_ENV}"
            fi
            if [ -n "${CXX:-}" ] && [ -x "$(which g++)" ]; then
              echo "CXX=$(which g++)" >> "${GITHUB_ENV}"
            fi
          else
            echo "::error::Matrix/Input var 'compiler' must be one of [clang, gcc, native]."
            exit 1
          fi
          if [ "${{inputs.bazel_config}}" == "asan" ]; then
            BAZEL_ARGS+=("-c" "dbg" "--config=asan")
            if [ "${{inputs.compiler}}" == "gcc" ]; then
              BAZEL_ARGS+=("--config=asan-gcc")
            fi
          elif [ "${{inputs.bazel_config}}" == "coverage" ]; then
            BAZEL_ARGS+=("-c" "dbg")
            if [ "${{inputs.compiler}}" == "clang" ]; then
              BAZEL_ARGS+=(
                "--experimental_use_llvm_covmap"
                "--experimental_generate_llvm_lcov"
                "--copt=-fcoverage-compilation-dir=."
              )
            fi
          elif [ "${{inputs.bazel_config}}" == "fastbuild" ]; then
            BAZEL_ARGS+=("-c" "fastbuild")
          elif [ "${{inputs.bazel_config}}" == "opt" ]; then
            BAZEL_ARGS+=("-c" "opt")
          else
            echo "::error::Matrix/Input var 'bazel_config' must be one of [asan, coverage, fastbuild, opt]."
            exit 1
          fi
          # Pin the Bazel release that bazelisk launches. bazelisk resolves the
          # version with this precedence: `USE_BAZEL_VERSION` (env) > `.bazeliskrc`
          # > `.bazelversion`. We want `.bazelversion` to be the single source of
          # truth, so we neutralize any inherited `USE_BAZEL_VERSION` by exporting
          # it empty: bazelisk treats an empty value as "unset" (`len(v) != 0`)
          # and falls through to `.bazelversion`. (There is no `.bazeliskrc` in
          # this repo, so nothing else outranks the file.)
          #
          # When the caller passes `bazel_version` we overwrite `.bazelversion`;
          # otherwise the checked-in pin stands. Either way EXPECT_BAZEL records
          # the version we expect `bazel --version` to report, so "Show compiler"
          # still fails loudly if bazelisk somehow launched a different release.
          echo "USE_BAZEL_VERSION=" >> "${GITHUB_ENV}"
          if [ -n "${{inputs.bazel_version}}" ]; then
            echo "${{inputs.bazel_version}}" > .bazelversion
          fi
          # Bazel 7/8 half-apply `external_include_paths`: they add the
          # `-isystem external/...` entries but keep the legacy `-iquote`
          # duplicates, so a quoted `#include "absl/..."` resolves via the
          # quote path and loses system-header warning suppression - external
          # pedantic findings (absl's diagnose_if, __int128) then fail our
          # -Werror. Bazel 9 drops the -iquote duplicates. The old-bazel rungs
          # exist as build-system-compat checks; the warning bar is enforced by
          # every bazel-9 job, so relax -Wpedantic here rather than carve out
          # each external finding compiler by compiler.
          case "$(tr -d '[:space:]' < .bazelversion)" in
            7.*|8.*)
              BAZEL_ARGS+=("--cxxopt=-Wno-pedantic" "--host_cxxopt=-Wno-pedantic") ;;
          esac
          if [ -n "${SDKPATH:-}" ]; then
            BAZEL_ARGS+=(--action_env=SDKROOT=${SDKPATH})
          fi
          EXPECT_BAZEL="$(tr -d '[:space:]' < .bazelversion 2>/dev/null || true)"
          echo "BAZEL_INIT=${BAZEL_INIT[*]}" >> "${GITHUB_ENV}"
          echo "BAZEL_ARGS=${BAZEL_ARGS[*]}" >> "${GITHUB_ENV}"
          echo "EXPECT=${EXPECT}" >> "${GITHUB_ENV}"
          echo "EXPECT_BAZEL=${EXPECT_BAZEL}" >> "${GITHUB_ENV}"
          echo "Resolved BAZEL_INIT: ${BAZEL_INIT[*]}"
          echo "Resolved BAZEL_ARGS: ${BAZEL_ARGS[*]}"
          echo "Expected compiler prefix: ${EXPECT:-<none>}"
          echo "Expected Bazel version: ${EXPECT_BAZEL:-<none>}"

      - name: Show compiler
        # Probe the actually-selected toolchain (using the flags resolved in
        # "Setup") and ASSERT it matches what the matrix asked for, so a silent
        # toolchain fallback fails CI here -- with a clear message -- rather than
        # producing a green build that used the wrong compiler. Also records the
        # Bazel version in the log for diagnostics.
        run: |
          BAZEL_VERSION="$(bazel --version | awk '{print $2}')"
          echo "Bazel: ${BAZEL_VERSION}"
          if [ -n "${EXPECT_BAZEL}" ] && [[ "${EXPECT_BAZEL}" =~ ^[0-9] ]]; then
            if [ "${BAZEL_VERSION}" != "${EXPECT_BAZEL}" ]; then
              echo "::error::Expected Bazel version '${EXPECT_BAZEL}' but bazelisk launched '${BAZEL_VERSION}'."
              exit 1
            fi
            echo "OK: Bazel version matches expected '${EXPECT_BAZEL}'."
          fi
          COMPILER="$(bazel ${BAZEL_INIT} run ${BAZEL_ARGS} //tools:show_compiler)"
          echo "Selected compiler: ${COMPILER}"
          if [ -n "${EXPECT}" ]; then
            case "${COMPILER}" in
              "${EXPECT}"*) echo "OK: compiler matches expected prefix '${EXPECT}'." ;;
              *) echo "::error::Expected compiler prefix '${EXPECT}' but selected '${COMPILER}'."; exit 1 ;;
            esac
          fi

      - name: Build and Test
        if: inputs.bazel_config != 'coverage'
        run: |
          [ -n "${CC:-}" ] && [ -x "${CC}" ] && echo "CC: $(${CC} --version)"
          [ -n "${CXX:-}" ] && [ -x "${CXX}" ] && echo "CXX: $(${CXX} --version)"
          echo "BAZEL_INIT: ${BAZEL_INIT}"
          echo "BAZEL_ARGS: ${BAZEL_ARGS}"
          bazel ${BAZEL_INIT} test ${BAZEL_ARGS} //... \
            //mbo/hash:hash_differential_test
          bazel ${BAZEL_INIT} test ${BAZEL_ARGS} \
            --//mbo/hash:mangle_seed_buckets=0 \
            //mbo/hash:hash_mangle_test

      - name: Collect coverage
        if: inputs.bazel_config == 'coverage'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bazel ${BAZEL_INIT} coverage ${BAZEL_ARGS} //... \
            --combined_report=lcov \
            --instrumentation_filter='^//mbo/.*' \
            --test_tag_filters=-lfs,-fuzz-test,-no-coverage
          cp "$(bazel ${BAZEL_INIT} info output_path)/_coverage/_coverage_report.dat" coverage.lcov

          # Fatal requirements normally terminate the process before it can
          # flush coverage. Exercise those same production paths under the
          # supported exception policy and merge their observations into the
          # exception-free library's primary report.
          bazel ${BAZEL_INIT} coverage ${BAZEL_ARGS} \
            --//mbo/config:require_throws=true \
            //mbo/container:limited_map_require_exceptions_test \
            //mbo/json:json_require_exceptions_test \
            --combined_report=lcov \
            --instrumentation_filter='^//mbo/(container|json)[/:].*'
          cp "$(bazel ${BAZEL_INIT} info output_path)/_coverage/_coverage_report.dat" coverage-exceptions.lcov
          # Apply the source-owned normalization before LCOV reads and combines
          # GCC's repeated template records. This retains LCOV's integrity
          # checks instead of broadly suppressing corrupt-trace errors.
          python3 tools/coverage_sources.py \
            coverage.lcov coverage-primary-normalized.lcov --normalize-only
          python3 tools/coverage_sources.py \
            coverage-exceptions.lcov coverage-exceptions-normalized.lcov --normalize-only
          python3 tools/coverage_merge.py \
            coverage-primary-normalized.lcov \
            coverage-exceptions-normalized.lcov \
            coverage-merged.lcov
          mv coverage-merged.lcov coverage.lcov

          coverage_page="${{ inputs.coverage_target }}"
          if [ -z "${coverage_page}" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            coverage_page="main"
          elif [ -z "${coverage_page}" ] && [ "${GITHUB_EVENT_NAME}" = "pull_request" ] &&
            [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            coverage_page="pr/${PR_NUMBER}"
          elif [ -z "${coverage_page}" ]; then
            # Preserve a useful fallback for other workflow_call consumers.
            pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')"
            if [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
              coverage_page="pr/${pr_number}"
            fi
          fi
          if [ -n "${coverage_page}" ]; then
            printf '%s\n' "${coverage_page}" >coverage-target.txt
          fi

          python3 tools/coverage_sources.py coverage.lcov coverage-html.lcov \
            --policy coverage_policy.json \
            --source-root coverage-source-tree
          python3 tools/coverage_lcovrc.py coverage_policy.json coverage.lcovrc
          # LLVM can mark a hit line whose branches remain unevaluated, and GCC 14
          # cannot provide function-end exclusions. LCOV 2.5 classifies these as
          # inconsistent/corrupt and unsupported; repeated categories also suppress
          # their expected warning summaries.
          genhtml coverage-html.lcov \
            --branch-coverage \
            --config-file coverage.lcovrc \
            --demangle-cpp \
            --function-coverage \
            --hierarchical \
            --ignore-errors corrupt,inconsistent,inconsistent,negative,unsupported,unsupported \
            --output-directory coverage-html/lcov \
            --prefix "${PWD}/coverage-source-tree" \
            --show-details \
            --title "mbo production coverage"
          python3 tools/coverage_html.py coverage-html/lcov coverage_policy.json "${coverage_page}"

          python3 -m unittest tools/coverage_test.py tools/coverage_merge_test.py \
            tools/coverage_sources_test.py \
            tools/coverage_html_test.py tools/coverage_index_test.py tools/coverage_lcovrc_test.py \
            tools/coverage_policy_test.py
          BASE_ARGS=()
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --quiet --no-tags --unshallow origin
            fi
            git fetch --quiet --no-tags origin main
            BASE_ARGS=(--base-ref origin/main)
          fi
          python3 tools/coverage.py \
            --baseline coverage_baseline.json \
            --lcov coverage.lcov \
            --json-summary coverage-html/coverage-summary.json \
            --policy coverage_policy.json \
            --summary coverage-summary.md \
            "${BASE_ARGS[@]}"
          {
            echo "### Production coverage"
            echo
            if [ -n "${coverage_page}" ]; then
              python3 tools/coverage_index.py report \
                coverage-html/coverage-summary.json "${coverage_page}" coverage-html/index.html
              echo "[Browse the HTML coverage report](https://mboworks.github.io/mbo/coverage/${coverage_page}/)."
              echo
            fi
            echo "[Download this run's coverage artifact](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)."
            echo
            cat coverage-summary.md
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always() && inputs.bazel_config == 'coverage'
        with:
          name: coverage-report
          path: |
            coverage-html/
            coverage*.lcov
            coverage-summary.md
            coverage-target.txt
          retention-days: 14
          if-no-files-found: error

      - name: Check Bazel ${{inputs.bazel_config}} disk cache size
        if: ${{!startsWith(github.ref, 'refs/tags/')}}
        id: cache_size
        run: |
          cache_path="${HOME}/.cache/bazel_disk-cache"
          cache_size_kib=0
          if [[ -d "${cache_path}" ]]; then
            cache_size_kib="$(du -sk "${cache_path}" | awk '{print $1}')"
          fi
          echo "Bazel disk cache: ${cache_size_kib} KiB (limit: 512000 KiB)"
          if (( cache_size_kib >= 500 * 1024 )); then
            echo "::warning::Not saving Bazel disk cache at or above the 500 MiB limit."
            echo "save=false" >>"${GITHUB_OUTPUT}"
          else
            echo "save=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Save Bazel ${{inputs.bazel_config}} disk cache
        uses: actions/cache/save@v6
        if: ${{!startsWith(github.ref, 'refs/tags/') && steps.cache_size.outputs.save == 'true'}}
        id: cache_save
        with:
          path: "~/.cache/bazel_disk-cache"
          key: ${{env.CACHE_KEY_PREFIX}}-${{github.ref}}-${{github.sha}}
