ci:
  # The `trunk` CI job runs the full `trunk check` already; do not also run
  # trunk from pre-commit in CI (mirrored by `SKIP: trunk-fmt` in main.yml).
  skip: [trunk-fmt]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            ^mbo/diff/tests/abc_whitespace.*$|
            ^mbo/diff/tests/numbers_blanks.*|
            .*[.]patch
          )
      - id: trailing-whitespace
        exclude: |
          (?x)(
            ^mbo/diff/tests/abc_whitespace.*$|
            ^mbo/diff/tests/numbers_blanks.*|
            .*[.]patch
          )

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflow files
        description: Runs actionlint to lint GitHub Actions workflow files
        language: golang
        types: ["yaml"]
        files: ^\.github/workflows/
        entry: actionlint
        # GitHub supports queue: max; actionlint (including v1.7.12) does not yet.
        # Keep the exception limited to that documented concurrency key.
        # https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency
        args:
          [
            "-shellcheck",
            "",
            "-ignore",
            'unexpected key "queue" for "concurrency" section',
          ]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        types_or: [c, c++, markdown]
        # `ND` is the Myers complexity term, `abd` is deliberate hash input,
        # `FileTest` is a GoogleTest fixture type, and `whats` is byte-exact
        # input from the official BLAKE3 test vectors.
        args: ["--ignore-words-list=abd,filetest,hart,nd,whats"]
      - id: codespell
        name: codespell C++ templates
        # `.mope` is a project-specific C++ template extension, so identify
        # that source explicitly while standard files use pre-commit types.
        files: "[.]mope$"
        types: [text]
        args: ["--ignore-words-list=abd,filetest,hart,nd,whats"]

  - repo: local
    hooks:
      - id: mope-uses-external-clang
        name: mope-uses-external-clang
        description: |
          File //mbo/mope/mope.bzl can be configured to find clang-format automatically.
          However, the repo version must set `_CLANG_FORMAT_BINARY = ""` so that it uses
          the repo provided version which does not work for Bazel module use.
        language: pygrep
        entry: _CLANG_FORMAT_BINARY\s+=\s+"[^"]+"
        files: mbo/mope/mope.bzl
      - id: uncomment-bazelmod-includes
        name: uncomment-bazelmod-includes
        description: |
          The repo version of MODULE.bazel may not have commented out includes.
        language: pygrep
        entry: \s*#\s*include
        files: MODULE.bazel
      - id: no-deps-on-measurements
        name: no deps on mbo/hash/measurements
        description: |
          mbo/hash/measurements is dev-only tooling, stripped from release archives
          (release_prep.sh EXCLUDES). Nothing outside it may load from or depend on
          it (label `//mbo/hash/measurements`), or a release build would carry a
          dangling reference. Dependency edges stay one-way: measurements -> library.
        language: pygrep
        entry: //mbo/hash/measurements
        files: \.(bazel|bzl)$
        exclude: ^mbo/hash/measurements/
      - id: github-bazelmod-patch-applies
        name: github-bazelmod-patch-applies
        description: |
          The patch in .github/workflows/bazelmod.patch can be applied
        language: system
        entry: patch
        args: ["-p1", "--dry-run", "-fi", ".github/workflows/bazelmod.patch"]
        pass_filenames: False
        types: [text]
      - id: compare-versions
        name: compare-versions
        description: |
          Compare the versions in CHANGELOG.md and MODULES.bazel.
        language: system
        entry: .pre-commit/check_version.sh
        pass_filenames: False
        types: [text]
      - id: clang-tidy-targets-match-tag
        name: clang-tidy targets match the tag
        description: |
          `CLANG_TIDY_MANUAL_TARGETS` in bazelmod/clang_tidy_targets.bzl must equal the set of
          targets tagged `clang-tidy`. The list exists because aquery expands `//...` with
          `manual` targets already removed, so //bazelmod:refresh_compile_commands has to name
          them explicitly or they never reach compile_commands.json. The tag states the intent;
          this stops the two drifting apart. Skips when bazel is unavailable.
        language: system
        entry: .pre-commit/check_clang_tidy_targets.sh
        pass_filenames: false
        files: ^(.*/BUILD\.bazel|bazelmod/clang_tidy_targets\.bzl)$
      - id: cc-target-naming
        name: cc_library targets end in _cc
        description: |
          A C++ library target is named `<thing>_cc`, so a label reads as "the C++ library for
          <thing>" and never collides with the directory, file or binary of the same name. Ported
          from mboworks/xff, which enforces the same convention; two targets here had drifted
          (`hash_internal_util`, `hash_test_util`). The check is pure BUILD-file parsing, so it
          needs no bazel and runs anywhere.
        language: system
        entry: tools/check_cc_target_naming.py
        files: ^.*/(BUILD\.bazel|BUILD)$
      - id: library-test-coverage
        name: every cc_library has a test in its own package
        description: |
          Every `cc_library` needs a test in the SAME package with a DIRECT dependency on it
          (STYLE_CPP.md). Transitive coverage does not count - a library pulled in by another
          library that happens to have a test is not itself tested - and neither does a non-test
          dependent. Replaces the earlier reachability check, which reported 1 untested library
          where this rule finds the truth (it reported ~30 before the burn-down). Exceptions live
          in the tool's _ALLOWLIST with their reason. Pure BUILD-file parsing: no bazel needed.
        language: system
        entry: tools/check_cc_library_tested.py
        files: ^.*/(BUILD\.bazel|BUILD)$
      - id: explicit-test-sizes
        name: direct Bazel tests declare their size
        description: Keep test scheduling classes explicit; project macros provide documented defaults.
        language: python
        entry: tools/check_test_sizes.py
        files: ^.*/(BUILD\.bazel|BUILD)$
      - id: headers-claimed
        name: every header is claimed by its package BUILD file
        description: |
          A header no target lists in hdrs/srcs is invisible to the build and therefore to the
          clang-tidy gate, which reaches headers only through an including translation unit. Found
          a real one on first run: hash_tembo.h, orphaned since #306. Textual and package-scoped,
          mirroring bazel's package-relative labels; exceptions live in the tool's _ALLOWLIST with
          reasons. No bazel needed.
        language: system
        entry: tools/check_headers_claimed.py
        files: ^(mbo/.*\.h|.*/BUILD\.bazel)$
      - id: header-guards
        name: header guards follow STYLE_CPP
        description: |
          Header guards must be `{PATH}_{FILE}_` per STYLE_CPP.md. clang-tidy cannot check this:
          readability-identifier-naming's UPPER_CASE splits inside words at digit boundaries (it
          wants MBO_DIGEST_DIGEST_M_D5_H for digest_md5.h) and drops the trailing underscore, so
          it can never accept the documented convention - which is why guard-shaped names are
          exempted from it there. llvm-header-guard is likewise disabled, deriving the guard from
          the absolute checkout path. This enforces the actual rule, including that the closing
          `#endif` comment names the guard.
        language: python
        entry: .pre-commit/check_header_guards.py
        files: \.h$
      - id: no-do-not-merge
        name: No 'DO NOT MERGE'
        description: |
          * You can add 'DONOTMERGE', 'DONOTSUBMIT', 'DO NOT MERGE', 'DO NOT SUBMIT', 'DON'T MERGE',
            'DON'T SUBMIT' or the same with underscores instead of spaces to prevent merging.
          * To run `pre-commit` without this hook, run `SKIP="no-do-not-merge" pre-commit`.
        language: pygrep
        args: [-i]
        entry: DO([ _]?NOT|N'T)[ _]?(SUBMIT|MERGE)
        exclude: ^.pre-commit-config.yaml$
        types: [text]
      - id: no-gtest-comparison-macros
        name: Enforce GoogleTest matcher style
        description: |
          Do not use EXPECT_/ASSERT_ EQ, NE, LT, LE, GT, GE, STREQ, STRNE, STRCASEEQ,
          STRCASENE, FLOAT_EQ, DOUBLE_EQ, or NEAR. Use ASSERT_THAT or EXPECT_THAT with
          matchers instead. For multi-line text use mbo::testing::EqualsText, which
          produces a useful unified diff on failure.
        language: script
        entry: tools/check_test_matchers.sh
        types_or: [c, c++]
      - id: no-em-dashes
        name: No em dashes
        description: Use a spaced hyphen in prose, documentation, and comments.
        language: pygrep
        entry: "—"
        exclude: ^\.pre-commit-config\.yaml$|\.(phar|tar|tgz|gz|bz2|xz|zst|zip|jar|war|ear|apk|aab|whl|egg|7z)$
        types: [text]
      - id: no-braced-init-list-loop
        name: No range-for over an inline braced-init-list
        description: Iterate a named constexpr std::array so the set has a name and can be reused.
        language: pygrep
        entry: 'for\s*\([^)]*:\s*\{'
        types_or: [c, c++]
      - id: no-comparison-in-check-macro
        name: No comparison inside a boolean CHECK
        description: Use comparison CHECK macros so failures print both operands.
        language: pygrep
        entry: '\b(ABSL_)?(D|Q)?CHECK\([^;]*(!=|==|<=|>=)'
        types_or: [c, c++]
      - id: no-isok-assert-then-deref
        name: No ASSERT_THAT(x, IsOk()) followed by dereferencing x
        description: Bind a StatusOr value once or use IsOkAndHolds.
        language: python
        entry: tools/check_status_assert.py
        files: _test\.cc$
      - id: no-todos-without-context
        name: No TODOs without context
        description: |
          * Use descriptive, referenceable TODOs. Examples:
            * `// TODO(nero.windstriker@helly25.com)`
            * `# FIXME(https://github.com/mboworks/bzl/issues/42)`
          * From the google style guide:
            Use FIXME/TODO comments for code that is temporary, a short-term solution.
            FIXME/TODOs should include the string `FIXME` or `TODO` in all caps, followed by a person's
            e-mail address, or url with the best context about the problem referenced by the FIXME/TODO.
          * A bug or other URL reference is better than a person, as the person may become unavailable.
          * If a developer is referenced then it does not need to be the one writing the FIXME/TODO.
            * It is more important to note the most knowledgable person.
            * If you add someone else, first clarify with them.
          * Concretely, FIXMEs and TODOs without a context are rather pointless. That is, sooner or
            later noone knows why they were introduced and they will simply get deleted.
          * It is impossible to systematically find your own TODOs, someone else' or perform any other
            kind of statictics on them. The issue is that the blame tool tracks the last change, so you
            would need a tool that can follow the history to the actual introduction of the FIXME/TODOs.
          * To run `pre-commit` without this hook, run `SKIP="no-todos-without-context" pre-commit`
        language: pygrep
        args: [-i]
        exclude: ^[.]pre-commit-config.yaml$
        entry: (#|//|/[*]).*(FIXME|TODO)[(](?!(((\w|\w[.-]\w)+@(\w|-)+([.](\w|-)+)*)|(https?://[^)]+))(,[^)]+)?)[)]
        #      1         1  1          1   1  234           4  4    4 4   5    5 4 3 3              322      2 1
        types: [text]
      - id: done-gate-covers-all-jobs
        name: done gate covers all jobs
        description: Ensure the `done` job in main.yml `needs` every other job, so no job escapes the gate.
        language: python
        additional_dependencies: [pyyaml]
        entry: python .pre-commit/check_done_gate.py
        files: ^\.github/workflows/main\.yml$
        pass_filenames: false
      - id: cache-cleanup-selection
        name: cache cleanup selects expired matching caches
        description: Verify main-branch cache cleanup keeps the newest cache for each exact prefix.
        language: system
        entry: python3 -m unittest tools/cache_cleanup_test.py
        files: ^(\.github/workflows/cache_cleanup\.yml|tools/cache_cleanup(_test)?\.py)$
        pass_filenames: false
      - id: coverage-policy-tests
        name: coverage policy tests
        description: Verify LCOV parsing, grouping, indexing, presentation, exclusions, and threshold enforcement.
        language: system
        entry: python3 -m unittest tools/coverage_test.py tools/coverage_sources_test.py tools/coverage_html_test.py tools/coverage_index_test.py tools/coverage_lcovrc_test.py tools/coverage_policy_test.py
        files: ^(coverage_policy\.json|tools/coverage(_html|_index|_lcovrc|_policy|_sources)?(_test)?\.py)$
        pass_filenames: false
      - id: align-markdown-tables
        name: Align Markdown tables
        description: Keep Markdown table columns vertically aligned in source files.
        language: script
        entry: tools/align_markdown_tables.py
        types: [markdown]
      - id: align-markdown-tables-test
        name: Test the Markdown table aligner
        language: system
        entry: python3 -m unittest tools/align_markdown_tables_test.py
        files: ^tools/align_markdown_tables(_test)?\.py$
        pass_filenames: false
      - id: benchmark-artifact-tests
        name: Test benchmark artifact production and validation
        language: system
        entry: python3 -m unittest tools/benchmark_artifact_test.py
        files: ^tools/benchmark_artifact(_test)?\.py$
        pass_filenames: false
      - id: clang-tidy
        name: clang-tidy
        description: |
          Runs clang-tidy over the given C++ sources via tools/clang_tidy.sh, an enforcing
          pass (no --fix, so it never rewrites the tree). It needs a compile_commands.json
          (a gitignored local artifact; build it with ./compile_commands-update.sh) and a
          clang-tidy >= 18 for this C++23 codebase.
          * clang-tidy used to run under trunk, pinned at 16; that version mis-parses C++23
            and trunk auto-applied its build-breaking fixes. Do not re-add it to trunk.
          * Run it over everything: `pre-commit run clang-tidy --all-files`.
          * In CI the dedicated `clang-tidy` job owns this: it builds the compile DB, uploads
            it as an artifact, and invokes this same script directly so per-file progress streams
            live. The main `pre-commit` job skips it.
          * This is now an AUTOMATIC gate: it runs on the C++ sources a commit touches, and
            `WarningsAsErrors: '*'` makes any finding fail the commit. It only reached that
            point once the tree was clean - see the `.clang-tidy` comments for which checks
            were turned off and why.
          * It needs a compile DB, and it FAILS rather than skips without one: an incomplete
            dev environment is an error, not a reason to wave a commit through. Build it with
            ./compile_commands-update.sh.
          * To run `pre-commit` without this hook, run `SKIP="clang-tidy" pre-commit`.
        language: script
        entry: tools/clang_tidy.sh
        types: [file]
        files: (\.(cc|cpp|cxx|h|hh|hpp|hxx|inc|ipp|bzl)$|\.h\.in$)
      - id: clang-tidy-scope-test
        name: Test clang-tidy orchestration
        language: system
        entry: python3 -m unittest tools/clang_tidy_compdb_test.py tools/clang_tidy_scope_test.py tools/clang_tidy_runner_test.py
        files: ^tools/clang_tidy_(compdb|scope|runner)(_test)?\.py$
        pass_filenames: false
      - id: trunk-fmt
        name: trunk fmt
        description: |
          Runs the formatters pinned in .trunk/trunk.yaml (prettier, buildifier, ...) on the
          staged files, so nothing passes the hooks locally but fails the `trunk` CI job.
          * pre-commit remains the sole owner of the git hooks: this merely invokes the trunk
            CLI; trunk's own git-hook actions stay disabled in .trunk/trunk.yaml.
          * Requires the trunk launcher (`brew install trunk-io`, https://docs.trunk.io/cli).
          * Skipped in CI (`SKIP: trunk-fmt` in main.yml plus the `ci:` block above), where the
            `trunk` job runs the full check.
          * To run `pre-commit` without this hook, run `SKIP="trunk-fmt" pre-commit`.
        language: system
        entry: trunk fmt
        require_serial: true

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.6
    hooks:
      - id: clang-format
        # The default `types_or` for this hook includes `json`, where
        # clang-format fights with trunk's prettier (multi-line vs single-line
        # arrays). Restrict to actual C/C++/CUDA sources.
        types_or: [c, c++, cuda]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args: ["-bn", "-ci", "-i=2", "-w"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
