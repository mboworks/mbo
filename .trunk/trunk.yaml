# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: buildifier
      files: [starlark, bazel-build, bazel-workspace]
      tools: [buildifier]
      commands:
        - name: fix
          run: buildifier --lint=fix "${target}"
          output: rewrite
          cache_results: true
          formatter: true
          in_place: true
          batch: true
          success_codes: [0]
        - name: warn
          run: buildifier --lint=warn --format=json --mode=check "${target}"
          # Custom parser type defined in the trunk cli to handle buildifier's JSON output.
          output: buildifier
          cache_results: true
          batch: true
          success_codes: [0]
      suggest_if: files_present
      direct_configs:
        - .buildifier.json
        # Not a native buildifier construct, but useful for 'addTables', see test file
        - .buildifier-tables.json
      environment:
        - name: PATH
          list: ["${linter}"]
      known_good_version: 7.1.0
      version_command:
        parse_regex: ${semver}
        run: buildifier --version
  # clang-tidy is deliberately NOT a trunk linter: trunk pins clang-tidy 16, which
  # mis-parses this C++23 codebase, and its `--export-fixes` runs then rewrote the
  # working tree with build-breaking "fixes". trunk.io 403s any modern clang-tidy
  # download, so a version bump here is not possible. It now lives in the local-only
  # `clang-tidy` pre-commit hook (tools/clang_tidy.sh, hermetic clang >= 22); CI's
  # hard gate stays the bazel -Werror matrix. Do not re-add it here.
  enabled:
    - buildifier@8.5.1
    - checkov@3.3.6
    - git-diff-check
    - markdownlint@0.49.0
    - prettier@3.9.4
    - trivy@0.72.0
    - trufflehog@3.95.7
    - yamllint@1.38.0
actions:
  # Git hooks are owned by pre-commit (see .pre-commit-config.yaml). These trunk
  # actions install git hooks and would take over core.hooksPath, so keep them
  # disabled so trunk never clobbers pre-commit's clang-format run. Re-enabling
  # any of them is an obvious diff here and is what a reviewer must reject.
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
